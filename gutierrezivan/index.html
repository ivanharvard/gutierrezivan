<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta
      name="description"
      content="Ivan Gutierrez is a Harvard computer scientist and software engineer working across systems, data, privacy, and education."
    />
    <meta property="og:title" content="Ivan Gutierrez — Software Engineer" />
    <meta
      property="og:description"
      content="Software engineering, data science, privacy research, and computer science education."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/images/avatar.jpg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Ivan Gutierrez",
        "url": "https://gutierrezivan.com",
        "image": "https://gutierrezivan.com/images/avatar.jpg",
        "email": "mailto:igzjobs@gmail.com",
        "jobTitle": "Software Engineer",
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "Harvard University"
        },
        "sameAs": [
          "https://github.com/ivanharvard",
          "https://www.linkedin.com/in/-ivan-gutierrez/"
        ]
      }
    </script>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = !saved || saved === 'toggle' ? 'dark' : saved === 'auto' ? (prefersDark ? 'dark' : 'light') : saved;
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.classList.add('theme-prevent-transition');
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <style>
      html, body { background: #1a1a1a; color: #f4f2ed; }
      #root { min-height: 100dvh; }
      html.theme-prevent-transition * { transition: none !important; }
    </style>
    <title>Ivan Gutierrez — Software Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load', function () {
        document.documentElement.classList.remove('theme-prevent-transition');
      });
    </script>
  </body>
</html>
